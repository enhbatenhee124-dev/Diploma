<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- `viewport-fit=cover` нь iPhone-ы notch хүртэл дэлгэцийг эзэлнэ.
       Үүнгүй бол standalone горимд дээд/доод талд хар зурвас үлдэнэ.
       Контентыг зурвасын ард орохоос `index.css`-ийн аюулгүй зай хамгаална. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>МонголАжил — цагийн ажлын зах зээл</title>

  <!-- PWA: утсанд суулгах боломж -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />

  <!-- iOS нь manifest-ийн icon-ыг ҮЛ ТООМСОРЛОДОГ бөгөөд зөвхөн PNG
       хүлээж авдаг тул тусад нь зааж өгнө.

       `?v=` нь САНААТАЙ: Safari icon-ыг нэг л удаа татаад удаан хадгалдаг.
       Энэ хаяг нь эхэндээ (PWA файлууд deploy болохоос өмнө) HTML буцааж
       байсан тул зарим утсанд эвдэрсэн icon кэшлэгдсэн. Дугаарыг ахиулах
       нь Safari-г дахин татахад хүргэнэ — лого солих бүрд бас ахиул. -->
  <link rel="apple-touch-icon" href="/icons/icon-180.png?v=2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ажил" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Plus Jakarta Sans нь ЗӨВХӨН нийтийн (Mufi сэдэвт) хуудсуудад
       хэрэглэгддэг — `font-jakarta`. Хянах самбарууд Inter хэвээр. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
